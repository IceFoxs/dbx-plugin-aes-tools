[package]
name = "dbx-plugin-aes-rust-plugin"
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
dbx-plugin-sdk = { version = "0.1.0" }
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
base64 = "0.22.1"
cipher = "0.4.4"
block-padding = "0.3.3"
serde_json = "1"
ureq = "2.10"
[patch.crates-io]
dbx-plugin-sdk = { path = "../shared/sdk/rust/dbx-plugin-sdk" }



# Keep plugin binaries close to the host app's size: default release settings
# leave ~20MB of symbols and unoptimized generic code in an OpenDAL-sized backend.
# panic stays "unwind" so the sidecar protocol can report panics as errors.
[profile.release]
strip = true
lto = true
codegen-units = 1
