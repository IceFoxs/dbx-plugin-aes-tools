<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- 冷白科技底板渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFCFF"/>
      <stop offset="50%" style="stop-color:#F2F7FC"/>
      <stop offset="100%" style="stop-color:#EDF3FA"/>
    </linearGradient>

    <!-- AES 主体高光 -->
    <linearGradient id="aesShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>

    <!-- 柔和投影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F3D5C" flood-opacity="0.15"/>
    </filter>

    <!-- 轻发光 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 底板内发光 -->
    <radialGradient id="plateGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#00B8D4;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 圆角方形裁剪 -->
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- ===== 图标底板 ===== -->
  <g clip-path="url(#roundedSquare)">
    <!-- 冷白科技底 -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- 底板内发光 -->
    <rect width="512" height="512" fill="url(#plateGlow)"/>

    <!-- 极细科技网格（浅青蓝） -->
    <g opacity="0.10" stroke="#0091EA" stroke-width="0.8">
      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
    </g>

    <!-- 斜向浅色光束 -->
    <g opacity="0.05" stroke="#00B8D4" stroke-width="1.5">
      <line x1="-100" y1="240" x2="612" y2="-60"/>
      <line x1="-100" y1="300" x2="612" y2="0"/>
      <line x1="-100" y1="360" x2="612" y2="60"/>
    </g>

    <!-- 四角电路装饰线（浅青蓝） -->
    <g opacity="0.25" stroke="#0091EA" stroke-width="1.5" fill="none">
      <path d="M40 80 L80 80 L80 60"/>
      <path d="M472 80 L432 80 L432 60"/>
      <path d="M40 432 L80 432 L80 452"/>
      <path d="M472 432 L432 432 L432 452"/>
    </g>
    <g opacity="0.3" fill="#00B8D4">
      <circle cx="40" cy="80" r="2"/>
      <circle cx="472" cy="80" r="2"/>
      <circle cx="40" cy="432" r="2"/>
      <circle cx="472" cy="432" r="2"/>
    </g>

    <!-- ===== AES 巨型字母（深青蓝实色，清晰锐利） ===== -->
    <g filter="url(#softShadow)">
      <text x="256" y="318" text-anchor="middle" font-size="190" font-weight="900"
            fill="#0F3D5C" letter-spacing="-6">AES</text>
    </g>

    <!-- 字母顶部高光 -->
    <text x="256" y="318" text-anchor="middle" font-size="190" font-weight="900"
          fill="url(#aesShine)" letter-spacing="-6">AES</text>

    <!-- 字母细描边（增强科技感） -->
    <text x="256" y="318" text-anchor="middle" font-size="190" font-weight="900"
          fill="none" stroke="#0091EA" stroke-width="1.8" letter-spacing="-6"
          opacity="0.35">AES</text>

    <!-- ===== 字母上方锁形点缀（青蓝科技） ===== -->
    <g filter="url(#softGlow)">
      <path d="M244 88 L244 78 Q244 64 256 64 Q268 64 268 78 L268 88"
            fill="none" stroke="#0091EA" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
      <rect x="236" y="88" width="40" height="30" rx="7" fill="#0091EA" opacity="0.85"/>
      <circle cx="256" cy="101" r="4.5" fill="#FAFCFF"/>
      <rect x="253.5" y="105" width="5" height="7" rx="2.5" fill="#FAFCFF"/>
    </g>

    <!-- ===== 左侧箭头（加密，青蓝） ===== -->
    <g filter="url(#softGlow)">
      <polygon points="42,300 68,280 68,320" fill="#0091EA" opacity="0.8"/>
      <line x1="68" y1="300" x2="88" y2="300" stroke="#0091EA" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- ===== 右侧箭头（解密，青绿） ===== -->
    <g filter="url(#softGlow)">
      <polygon points="470,300 444,280 444,320" fill="#00A896" opacity="0.8"/>
      <line x1="444" y1="300" x2="424" y2="300" stroke="#00A896" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- ===== 底部说明文字（青蓝） ===== -->
    <g filter="url(#softGlow)">
      <text x="256" y="462" text-anchor="middle" font-size="16" font-weight="700"
            fill="#0091EA" letter-spacing="8" opacity="0.75">ENCRYPTION</text>
    </g>

    <!-- 底部装饰线 -->
    <line x1="176" y1="480" x2="336" y2="480" stroke="#0091EA" stroke-width="1.5"
          opacity="0.35" stroke-linecap="round"/>

    <!-- 顶部扫描光效 -->
    <rect x="0" y="0" width="512" height="180" rx="110" fill="url(#aesShine)" opacity="0.2"/>

    <!-- 光点装饰 -->
    <circle cx="100" cy="120" r="1.8" fill="#00B8D4" opacity="0.5"/>
    <circle cx="410" cy="390" r="1.8" fill="#0091EA" opacity="0.4"/>
    <circle cx="420" cy="120" r="1.2" fill="#00A896" opacity="0.4"/>
    <circle cx="90" cy="390" r="1.2" fill="#00B8D4" opacity="0.35"/>
  </g>

  <!-- 图标外边框（浅青蓝细线） -->
  <rect x="1" y="1" width="510" height="510" rx="109" fill="none" stroke="#90CAF9" stroke-width="1.5" opacity="0.6"/>
</svg>